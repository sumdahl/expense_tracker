{% extends "index.html" %}
{% block title %}Register - Expense Tracker{% endblock %}
{% block content %}
<main class="relative min-h-screen overflow-hidden">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.18),_transparent_45%)]"></div>
  <div class="relative flex min-h-screen items-center justify-center px-6 py-16">
    <div class="w-full max-w-md rounded-3xl border border-slate-800 bg-gradient-to-br from-slate-900 via-slate-900/70 to-slate-950 p-8 shadow-xl">
      <span class="inline-flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-emerald-200">
        New account
      </span>
      <h2 class="mt-6 text-3xl font-semibold text-white">Create your account</h2>
      <p class="mt-3 text-sm text-slate-300">Start tracking expenses with a calm, focused workflow.</p>

      <form
        class="mt-8 space-y-5"
        hx-post="/signup"
        hx-trigger="submit"
        hx-target="#error-message"
        hx-swap="innerHTML"
        hx-encoding="application/x-www-form-urlencoded"
        method="post"
        enctype="application/x-www-form-urlencoded"
      >
        <div>
          <label class="text-sm text-slate-300">Full Name</label>
          <input
            type="text"
            name="name"
            required
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-950 px-4 py-2 text-sm text-slate-100 focus:border-emerald-400 focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Email</label>
          <input
            type="email"
            name="email"
            required
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-950 px-4 py-2 text-sm text-slate-100 focus:border-emerald-400 focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Password</label>
          <input
            type="password"
            name="password"
            required
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-950 px-4 py-2 text-sm text-slate-100 focus:border-emerald-400 focus:outline-none"
          />
        </div>

        <div id="error-message" class="text-sm text-red-300"></div>

        <button
          type="submit"
          class="w-full rounded-md bg-emerald-400 px-5 py-3 text-sm font-semibold text-slate-950 hover:bg-emerald-300"
        >
          Create account
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-400">
        Already have an account?
        <a href="/signin" class="text-emerald-300 hover:text-emerald-200 font-semibold">Sign in</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
