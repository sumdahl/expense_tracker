{% extends "index.html" %} {% block title %}Register - Expense Tracker{%
endblock %} {% block content %}
<main class="relative min-h-screen overflow-hidden">
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.18),_transparent_45%)]"
  ></div>
  <div
    class="relative flex min-h-screen items-center justify-center px-6 py-16"
  >
    <div
      class="card w-full max-w-md bg-gradient-to-br from-slate-900 via-slate-900/70 to-slate-950 border border-slate-800 shadow-xl"
    >
      <div class="card-body">
        <div
          class="badge badge-success badge-outline uppercase tracking-[0.2em]"
        >
          New account
        </div>
        <h2 class="card-title mt-6 text-3xl font-semibold text-white">
          Create your account
        </h2>
        <p class="mt-3 text-sm text-slate-300">
          Start tracking expenses with a calm, focused workflow.
        </p>

        <form
          class="mt-8 space-y-5"
          hx-post="/signup"
          hx-trigger="submit"
          hx-target="#error-message"
          hx-swap="innerHTML"
          hx-encoding="application/x-www-form-urlencoded"
          method="post"
          enctype="application/x-www-form-urlencoded"
        >
          <div class="form-control">
            <label class="label">
              <span class="label-text text-slate-300">Full Name</span>
            </label>
            <input
              type="text"
              name="name"
              required
              class="input input-bordered bg-slate-950 border-slate-700 text-slate-100 focus:border-emerald-400"
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text text-slate-300">Email</span>
            </label>
            <input
              type="email"
              name="email"
              required
              class="input input-bordered bg-slate-950 border-slate-700 text-slate-100 focus:border-emerald-400"
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text text-slate-300">Password</span>
            </label>
            <input
              type="password"
              name="password"
              required
              class="input input-bordered bg-slate-950 border-slate-700 text-slate-100 focus:border-emerald-400"
            />
          </div>

          <div id="error-message" class="text-sm text-error"></div>

          <button
            type="submit"
            class="btn btn-success w-full bg-emerald-400 hover:bg-emerald-300 border-0 text-slate-950"
          >
            Create account
          </button>
        </form>

        <div class="divider my-4"></div>

        <div class="text-center text-sm text-slate-400">
          Already have an account?
          <a
            href="/signin"
            class="link link-success text-emerald-300 hover:text-emerald-200 font-semibold no-underline"
            >Sign in</a
          >
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
